<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Макет Truckplast24</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#f5f7fa; --surface-2:#e9eef4; --ink:#1f2933; --muted:#5b6775; --faint:#8a95a3;
  --line:#dde3ea; --line-2:#c7d0db;
  --accent:#1d5fd1; --accent-hover:#174fb0; --accent-ink:#ffffff; --accent-soft:#e8f0fc; --accent-text:#1d5fd1;
  --ok:#1f7446; --ok-soft:#e2f1e8; --warn:#8f540a; --warn-soft:#fbefd9;
  --bu:#6e4a28; --bu-soft:#f3eadf; --todo:#7a5200; --todo-soft:#fff3cc; --todo-line:#e8cf7c;
  --danger:#b3261e; --danger-soft:#fbe7e5;
  --hdr:#ffffff; --hero:#f5f7fa; --fade:#ffffff; --fade-0:rgba(255,255,255,0);
  --bar:#f5f7fa; --bar-ink:#1f2933; --bar-muted:#5b6775; --bar-chip:#ffffff; --bar-line:#dde3ea; --bar-tag:#7a5200; --bar-sel:#1d5fd1; --bar-sel-ink:#ffffff;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 16px rgba(16,24,32,.06);
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
/* Темы макета — свой атрибут data-skin: data-theme на корне ставит сам просмотрщик Artifact и перетёр бы «Тёплую». */
:root[data-skin="warm"]{
  color-scheme:light;
  --bg:#faf8f4; --surface:#f3efe8; --surface-2:#ebe5da; --ink:#2a241e; --muted:#6b6157; --faint:#9a8f83;
  --line:#e6dfd3; --line-2:#d4cabb;
  --accent:#e8630a; --accent-hover:#cf5708; --accent-ink:#ffffff; --accent-soft:#fdeee2; --accent-text:#b84d06;
  --ok:#2a7a3f; --ok-soft:#e5f1e3; --warn:#8f540a; --warn-soft:#faeed8;
  --bu:#6e4a28; --bu-soft:#f1e7da; --todo:#7a5200; --todo-soft:#fff1c7; --todo-line:#e5c96f;
  --danger:#b3261e; --danger-soft:#fbe5e1;
  --hdr:#ffffff; --hero:#f3efe8; --fade:#faf8f4; --fade-0:rgba(250,248,244,0);
  --bar:#f3efe8; --bar-ink:#2a241e; --bar-muted:#6b6157; --bar-chip:#ffffff; --bar-line:#e0d7c9; --bar-tag:#b84d06; --bar-sel:#e8630a; --bar-sel-ink:#ffffff;
}
:root[data-skin="dark"]{
  color-scheme:dark;
  --bg:#0e1319; --surface:#151c24; --surface-2:#1c2530; --ink:#e5eaf0; --muted:#9aa5b1; --faint:#6f7b88;
  --line:#26303b; --line-2:#344150;
  --accent:#8db4e2; --accent-hover:#a8c7ec; --accent-ink:#0b1118; --accent-soft:#1a2a3d; --accent-text:#8db4e2;
  --ok:#6cc592; --ok-soft:#14281d; --warn:#e3ab5c; --warn-soft:#2b2112;
  --bu:#d6b08a; --bu-soft:#2a2019; --todo:#f0c35a; --todo-soft:#2a2310; --todo-line:#5c4a1c;
  --danger:#f08a82; --danger-soft:#33191a;
  --hdr:#0e1319; --hero:#151c24; --fade:#0e1319; --fade-0:rgba(14,19,25,0);
  --bar:#06090c; --bar-ink:#dfe6ee; --bar-muted:#7d8996; --bar-chip:#1a2533; --bar-line:#33455a; --bar-tag:#f0c35a; --bar-sel:#f0c35a; --bar-sel-ink:#10171f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── mockup bar ── */
.mbar{background:var(--bar);color:var(--bar-ink);font-size:13px;border-bottom:1px solid var(--bar-line)}
.mbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:7px}
.mbar .tag{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px;color:var(--bar-tag);white-space:nowrap}
.mbar label{color:var(--bar-muted);display:flex;align-items:center;gap:6px}
.mbar select{background:var(--bar-chip);border:1px solid var(--bar-line);color:var(--bar-ink);border-radius:6px;padding:3px 6px;max-width:200px}
.seg{display:inline-flex;background:var(--bar-chip);border:1px solid var(--bar-line);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--bar-muted);padding:3px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--bar-sel);color:var(--bar-sel-ink);font-weight:600}
.mbar .sp{flex:1}

/* ── todo chip: things waiting for Maksim ── */
.todo{display:inline;background:var(--todo-soft);color:var(--todo);border:1px dashed var(--todo-line);border-radius:5px;padding:0 6px;font-size:12px;font-weight:500;line-height:20px;vertical-align:middle;max-width:100%}
.todo.block{display:block;white-space:normal;padding:8px 10px;line-height:1.45;font-size:13px}

/* ── site header ── */
.hdr{background:var(--hdr);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr-main{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding-block:14px}
.logo{display:flex;flex-direction:column;line-height:1;color:var(--ink);cursor:pointer;border:0;background:none;padding:0;text-align:left}
.logo b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.logo b span{color:var(--accent-text)}
.logo small{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.hsearch{position:relative;max-width:620px;width:100%;justify-self:center}
.hsearch form{display:flex}
.hsearch input{flex:1;min-width:0;border:1.5px solid var(--line-2);border-right:0;border-radius:8px 0 0 8px;padding:10px 14px;background:var(--bg);font-family:var(--mono);font-size:15px}
.hsearch input::placeholder{font-family:var(--sans);color:var(--faint)}
.hsearch input:focus{outline:none;border-color:var(--accent)}
.hsearch button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:0 8px 8px 0;padding:0 18px;font-weight:600;cursor:pointer}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:30;overflow:hidden}
.suggest a{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 12px;color:var(--ink);border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.suggest a:hover{background:var(--surface);text-decoration:none}
.suggest .sa{font-family:var(--mono);font-weight:600}
.suggest .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.suggest .all{display:block;padding:8px 12px;font-size:13px;color:var(--accent-text)}
.hact{display:flex;align-items:center;gap:18px}
.phone{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}
.phone b{font-size:15px;font-weight:600}
.phone small{font-size:11px;color:var(--muted)}
.ibtn{display:flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;color:var(--ink);padding:6px 4px;white-space:nowrap;font-weight:500}
.ibtn svg{width:20px;height:20px;flex:none}
.cartbtn{position:relative}
.cartbtn .cnt{position:absolute;top:-2px;left:12px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.cartbtn .sum{font-variant-numeric:tabular-nums;margin-left:8px}
.burger{display:none}
.hnav{border-top:1px solid var(--line)}
.hnav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.hnav button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.hnav button[aria-current="page"]{border-bottom-color:var(--accent);color:var(--accent-text)}
.hnav .bu-link{color:var(--bu)}
.whoami{margin-left:auto;align-self:center;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:12px}
.drawer{display:none}

/* ── common ── */
main{padding-block:24px 56px;min-height:60vh}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{cursor:pointer}
.crumbs span.sep{color:var(--faint)}
.h1{font-size:28px;font-weight:600;letter-spacing:-.01em}
.h2{font-size:20px;font-weight:600}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line-2);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.lg{padding:12px 20px;font-size:16px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;line-height:20px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bu{background:var(--bu-soft);color:var(--bu)}
.pill.info{background:var(--accent-soft);color:var(--accent-text)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.soft{background:var(--surface);border-radius:10px}
.stk{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap;font-size:13px;color:var(--muted)}
.stk b{color:var(--accent-text);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.stk i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;align-self:center}
.stk.bu i{background:var(--bu)}
.stks{display:flex;flex-wrap:wrap;gap:4px 14px}
.price b{color:var(--accent-text);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.price small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.price small s{color:var(--faint)}
.price.mine b{color:var(--accent-text)}
.qty{display:inline-flex;border:1.5px solid var(--line-2);border-radius:8px;overflow:hidden;height:38px}
.qty button{width:32px;border:0;background:var(--surface);cursor:pointer;font-size:17px;color:var(--ink)}
.qty input{width:46px;border:0;text-align:center;font-variant-numeric:tabular-nums;background:var(--bg);font-weight:600}
.buy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.buy .btn{height:38px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:500}
.field input,.field select,.field textarea{border:1.5px solid var(--line-2);border-radius:8px;padding:9px 12px;background:var(--bg);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field .hint{font-size:12px;color:var(--muted)}
.field .hint.bad{color:var(--danger)}
.field .hint.good{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;background:var(--surface);padding:9px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.ph{display:block;width:100%;height:auto;aspect-ratio:1;max-width:100%;border-radius:8px}
img.ph.photo{object-fit:contain;background:var(--surface);padding:6px;box-sizing:border-box}
img.ph.photo.main{padding:14px;border:1px solid var(--line)}
.thumbs img.ph.photo{padding:3px}
.featblock img.ph.photo{background:var(--bg)}
.featblock .bucard{background:var(--bg)}
.featblock .bucard img.ph.photo{background:var(--surface)}
.thumb{border:0;padding:0;background:none;cursor:pointer;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ── home ── */
.hero{background:var(--hero);border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:40px 36px;display:grid;gap:18px}
.hero h1{font-size:34px;font-weight:600;letter-spacing:-.015em;max-width:760px}
.hero h1 em{font-style:normal;color:var(--accent-text)}
.hero .lead{font-size:17px;color:var(--muted);max-width:640px;margin:0}
.bigsearch{display:flex;max-width:760px}
.bigsearch input{flex:1;min-width:0;border:2px solid var(--accent);border-right:0;border-radius:10px 0 0 10px;padding:15px 18px;font-size:19px;font-family:var(--mono);background:var(--bg)}
.bigsearch input::placeholder{font-family:var(--sans);font-size:16px;color:var(--faint)}
.bigsearch input:focus{outline:none}
.bigsearch button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:0 10px 10px 0;padding:0 26px;font-size:17px;font-weight:600;cursor:pointer}
.examples{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.examples button{border:1px solid var(--line-2);background:var(--bg);border-radius:6px;padding:1px 8px;font-family:var(--mono);font-size:13px;cursor:pointer;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums;margin-right:4px}
.sec{margin-top:40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:16px;font-weight:600}
.tile span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.node{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);cursor:pointer;text-align:left}
.node:hover{border-color:var(--accent)}
.node svg{width:34px;height:34px;flex:none;color:var(--accent-text)}
.node b{display:block;font-weight:600}
.node span{font-size:13px;color:var(--muted)}
.bublock{background:var(--bu-soft);border-radius:12px;padding:20px}
.bucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.bucard{background:var(--bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border:1px solid transparent}
.bucard:hover{border-color:var(--bu)}
.featblock{background:var(--surface);border-radius:12px;padding:20px}
.featblock .bucard:hover{border-color:var(--accent)}
.bucard .t{font-weight:500;font-size:14px;line-height:1.35}
.adv{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.adv div{border-top:2px solid var(--accent);padding-top:12px}
.adv b{display:block;font-size:16px;margin-bottom:4px}
.adv p{margin:0;color:var(--muted);font-size:14px}


/* ── carousel ── */
.car{position:relative;background:var(--fade);border-bottom:1px solid var(--line);overflow:hidden}
.car-track{display:flex;transition:transform .55s cubic-bezier(.3,.7,.2,1);touch-action:pan-y}
.slide{position:relative;flex:0 0 100%;height:420px;overflow:hidden}
.slide .media{position:absolute;top:0;bottom:0;right:0;left:38%}
.slide .media img{width:100%;height:100%;object-fit:cover;display:block}
.slide .media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--fade) 0%,var(--fade-0) 42%)}
.slide .media.art{background:var(--accent-soft);display:grid;place-items:center}
.slide .media.art::after{background:linear-gradient(90deg,var(--fade) 0%,var(--fade-0) 30%)}
.slide .media.art span{font-family:var(--mono);font-weight:600;font-size:64px;color:var(--accent);opacity:.9;letter-spacing:-.02em;text-align:center;line-height:1.05}
.slide .media.art small{display:block;font-size:16px;font-family:var(--sans);font-weight:500;color:var(--accent-text);opacity:1;margin-top:10px;letter-spacing:0}
.slide .txt{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:1240px;margin:0 auto;padding-inline:16px}
.slide .txt > *{max-width:500px}
.slide .kick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slide h1,.slide h2{font-size:34px;font-weight:600;letter-spacing:-.015em;line-height:1.15;color:var(--ink)}
.slide h1 em,.slide h2 em{font-style:normal;color:var(--accent-text)}
.slide .lead{font-size:17px;color:var(--muted);margin:0}
.slide .cond{font-size:15px;color:var(--ink);margin:0}
.slide .cond s{color:var(--muted)}
.car-ctl{position:absolute;left:0;right:0;bottom:18px;z-index:2;pointer-events:none}
.car-ctl .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.car-ctl .wrap > *{pointer-events:auto}
.dots{display:flex;gap:6px}
.dots button{width:26px;height:6px;border-radius:3px;border:0;background:var(--line-2);cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--accent)}
.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);font-size:20px;line-height:1}
.arr.prev{left:16px}.arr.next{right:16px}
.arr:hover{border-color:var(--accent)}
.searchband{background:var(--hero);border-bottom:1px solid var(--line)}
.searchband .wrap{padding-block:22px 24px;display:grid;gap:12px}
.searchband .lbl{margin:0}
@media (max-width:860px){
  .slide{height:auto;min-height:360px;display:flex;flex-direction:column}
  .slide .media{position:relative;left:0;height:150px;flex:none}
  .slide .media::after{background:linear-gradient(0deg,var(--fade) 0%,var(--fade-0) 45%)}
  .slide .media.art span{font-size:36px}
  .slide .media.art small{font-size:13px}
  .slide .txt{height:auto;justify-content:flex-start;padding-block:6px 84px;gap:10px;margin:0;width:100%}
  .slide h1,.slide h2{font-size:22px}
  .slide .lead{font-size:14px}
  .slide .cond{font-size:14px}
  .arr{top:75px;width:34px;height:34px;font-size:17px}
  .arr.prev{left:10px}.arr.next{right:10px}
  .car-ctl{bottom:14px}
}
@media (prefers-reduced-motion:reduce){.car-track{transition:none}}

/* ── listing ── */
.lst{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
.filters{display:flex;flex-direction:column;gap:18px;position:sticky;top:130px}
.filters fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.filters legend{padding:0;margin-bottom:6px}
.filters label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.filters input{accent-color:var(--accent)}
.filters label:has(input:checked){color:var(--accent-text);font-weight:600}
.filters select.on{border-color:var(--accent);color:var(--accent-text);font-weight:600}
.filters label span{margin-left:auto;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.filters select{border:1.5px solid var(--line-2);border-radius:8px;padding:7px 10px;background:var(--bg);width:100%}
.ftoggle{display:none}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.lhead select{border:1.5px solid var(--line-2);border-radius:8px;padding:6px 10px;background:var(--bg)}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) 190px 230px;gap:16px;padding:14px;border-top:1px solid var(--line);align-items:start;background:var(--bg)}
.row:first-child{border-top:0}
.row .ph{width:84px;cursor:pointer}
.row .art{font-family:var(--mono);font-weight:600;font-size:15px;cursor:pointer;color:var(--ink)}
.row .nm{margin:3px 0 6px;font-size:14px;line-height:1.4;cursor:pointer}
.row .nm:hover,.row .art:hover{color:var(--accent-text)}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.row .stks{flex-direction:column;gap:3px}
.row .pb{display:flex;flex-direction:column;gap:8px;align-items:flex-end;text-align:right}
.pager{display:flex;gap:4px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.pager button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.empty{padding:40px 20px;text-align:center}

/* ── product ── */
.pd{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:36px;align-items:start}
.gal{display:flex;flex-direction:column;gap:10px}
.thumbs{display:flex;gap:8px}
.thumbs .ph{width:64px;border:1.5px solid var(--line)}
.thumbs .ph.on{border-color:var(--accent)}
.pd h1{font-size:24px;font-weight:600;line-height:1.3}
.pd .artbig{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.buybox{margin-top:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.buybox .price b{font-size:32px}
.contact-row{display:flex;gap:8px;flex-wrap:wrap}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.trust div{font-size:13px;color:var(--muted);line-height:1.4}
.trust b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);border-radius:6px;padding:2px 9px;font-size:13px;background:var(--bg)}
.xsite{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;background:var(--accent-soft);border-radius:10px}
.cards4{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--bg)}
.mini:hover{border-color:var(--accent)}
.mini .a{font-family:var(--mono);font-weight:600;font-size:14px}
.mini .n{font-size:13px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .price b{font-size:17px}

/* ── cart / checkout ── */
.cartgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.whgroup{margin-bottom:18px}
.whgroup h3{font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cline{display:grid;grid-template-columns:56px minmax(0,1fr) auto 120px 32px;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.cline:first-of-type{border-top:0}
.cline .ph{width:56px}
.cline .rm{border:0;background:none;color:var(--faint);cursor:pointer;font-size:20px}
.cline .sum{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:16px}
.summary{padding:18px;display:flex;flex-direction:column;gap:10px;position:sticky;top:130px}
.summary .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.summary .tot{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.split{border:1px dashed var(--line-2);border-radius:10px;padding:12px 14px;margin-top:6px}
.steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;counter-reset:st}
.steps button{display:flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;color:var(--muted);font-size:14px}
.steps button::before{counter-increment:st;content:counter(st);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:12px;font-weight:700}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--accent-text)}
.steps button[aria-current="step"]::before{background:var(--accent);color:var(--accent-ink)}
.steps button.done::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.cobox{padding:22px;display:flex;flex-direction:column;gap:16px}
.radios{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rcard{border:1.5px solid var(--line-2);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.rcard:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rcard input{margin-top:4px;accent-color:var(--accent)}
.rcard b{display:block}
.rcard span{font-size:13px;color:var(--muted)}
.guestbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;background:var(--accent-soft);border-radius:10px;margin-bottom:18px}
.done-box{max-width:620px;margin:20px auto;text-align:center;padding:36px 24px}
.done-box .no{font-family:var(--mono);font-size:28px;font-weight:600;margin:8px 0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;accent-color:var(--accent)}

/* ── auth / account ── */
.auth{max-width:560px;margin:0 auto}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--accent)}
.acct{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.anav{display:flex;flex-direction:column;gap:2px}
.anav button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink)}

.ptype{padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ptype .big{font-size:26px;font-weight:600}

/* ── footer ── */
.ftr{background:var(--surface);border-top:1px solid var(--line);font-size:14px}
.ftr .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding-block:32px}
.ftr h4{margin:0 0 8px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ftr p{margin:0 0 6px;line-height:1.5}
.ftr .bottom{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted)}

/* ── responsive ── */
@media (max-width:1080px){
  .row{grid-template-columns:72px minmax(0,1fr) 200px}

  .row .stks{grid-column:2;flex-direction:row}
  .row .pb{grid-column:3;grid-row:1 / span 2}
  .phone{display:none}
}
@media (max-width:860px){

  .hsearch{grid-column:1/-1;grid-row:2;max-width:none}
  .hact{justify-self:end;gap:6px}
  .hact .ibtn .t{display:none}
  .cartbtn .sum{display:none}
  .burger{display:flex}
  .hnav{display:none}
  .drawer{display:block;border-top:1px solid var(--line);background:var(--bg)}

  .drawer button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 16px;font-size:16px;font-weight:500;cursor:pointer;color:var(--ink)}
  .drawer .dphone{padding:13px 16px;font-size:15px}
  .lst{grid-template-columns:1fr}
  .filters{display:none;position:static}
  .filters.show{display:flex;border:1px solid var(--line);border-radius:10px;padding:14px}
  .ftoggle{display:inline-flex}
  .pd{grid-template-columns:1fr;gap:20px}
  .cartgrid{grid-template-columns:1fr}
  .summary{position:static}
  .acct{grid-template-columns:1fr;gap:12px}
  .anav{flex-direction:row;overflow-x:auto}
  .anav button{white-space:nowrap}
  .ftr .wrap{grid-template-columns:1fr 1fr}
  .adv{grid-template-columns:1fr;gap:14px}
  .trust{grid-template-columns:1fr}
}
@media (max-width:560px){
  body{font-size:15px}
  .bucards{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:64%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
  .bucard{scroll-snap-align:start}
  .bublock,.featblock{padding:16px}
  .hero .wrap{padding-block:24px}
  .hero h1{font-size:25px}
  .hero .lead{font-size:15px}
  .bigsearch input{font-size:16px;padding:12px 12px}
  .bigsearch button{padding:0 16px;font-size:15px}
  .h1{font-size:23px}
  .row{grid-template-columns:64px minmax(0,1fr);gap:10px 12px}
  .row .ph{width:64px}
  .row .stks{grid-column:1/-1}
  .row .pb{grid-column:1/-1;grid-row:auto;flex-direction:row;justify-content:space-between;align-items:center;text-align:left;flex-wrap:wrap}
  .pd .artbig{font-size:24px}
  .gal > .ph{max-width:260px}
  .pd h1{font-size:19px}
  .buybox .price b{font-size:28px}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:8px}
  .grid2{grid-template-columns:1fr}
  .cline{grid-template-columns:48px minmax(0,1fr) 28px;gap:8px 10px}
  .cline .ph{width:48px}
  .cline .q{grid-column:2;grid-row:2}
  .cline .sum{grid-column:2 / 4;grid-row:3;text-align:left}
  .cline .rm{grid-column:3;grid-row:1}
  .ftr .wrap{grid-template-columns:1fr}
  .mbar .wrap{gap:6px 10px}
  .mbar .sp{display:none}
  .whoami{display:none}
  .cobox{padding:16px}
}

}

function innOk(v) {
  const d = v.replace(/\D/g, "");
  const c = (w) => w.reduce((s, k, i) => s + k * +d[i], 0) % 11 % 10;
  if (d.length === 10) return c([2, 4, 10, 3, 5, 9, 4, 6, 8]) === +d[9];
  if (d.length === 12) return c([7, 2, 4, 10, 3, 5, 9, 4, 6, 8]) === +d[10] && c([3, 7, 2, 4, 10, 3, 5, 9, 4, 6, 8]) === +d[11];
  return false;
}

    <h1 class="h1" style="margin-bottom:16px">Личный кабинет <span class="muted" style="font-size:16px;font-weight:400">· Сергей, ООО «Автопарк-Пример»</span></h1>
    <div class="acct"><nav class="anav">${tabs.map(([k, l]) => `<button type="button" data-acct="${k}" aria-current="${S.acctTab === k}">${l}</button>`).join("")}</nav><div>${body}</div></div>`;
}
function info() {
  return `<div class="auth"><h1 class="h1">Информационные страницы</h1><p class="muted">«Доставка и оплата», «Контакты», «О компании», оферта, политика, возврат — текстовые страницы; в макет не входят. Тексты юридических страниц берём с kabiny24.ru и меняем предмет. ${todo("тексты доставки и оплаты", 16)}</p><button class="btn" data-go="home">На главную</button></div>`;
}

// ── render / router ──
const VIEWS = { home, catalog: () => listing(false), bu: () => listing(true), search: searchScreen, product, cart, checkout, login, account, info };
// ── карусель главной: автопрокрутка 6,5 с, пауза при наведении/фокусе, точки, стрелки, свайп ──
let CAR = { i: 0, timer: null, paused: false };
function carGo(i) {
  const tr = document.getElementById("carTrack"); if (!tr) return;
  const n = tr.children.length; CAR.i = (i + n) % n;
  tr.style.transform = `translateX(${-CAR.i * 100}%)`;
  [...tr.children].forEach((sl, k) => { sl.setAttribute("aria-hidden", k !== CAR.i); sl.querySelectorAll("button,a").forEach(b => b.tabIndex = k === CAR.i ? 0 : -1); });
  document.querySelectorAll("#car .dots button").forEach((b, k) => b.setAttribute("aria-current", k === CAR.i));
}
function carInit() {
  clearInterval(CAR.timer);
  const car = document.getElementById("car"); if (!car) return;
  carGo(CAR.i);
  CAR.timer = setInterval(() => { if (!CAR.paused && !document.hidden) carGo(CAR.i + 1); }, 6500);
  car.addEventListener("mouseenter", () => CAR.paused = true);
  car.addEventListener("mouseleave", () => CAR.paused = false);
  car.addEventListener("focusin", () => CAR.paused = true);
  car.addEventListener("focusout", () => CAR.paused = false);
  let x0 = null, y0 = 0;
  car.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; CAR.paused = true; }, { passive: true });
  car.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) carGo(CAR.i + (dx < 0 ? 1 : -1)); x0 = null; CAR.paused = false; }, { passive: true });
}
function render(keepScroll) {
  const main = VIEWS[S.screen] ? VIEWS[S.screen]() : home();
  const full = S.screen === "home";
  document.getElementById("site").innerHTML = header() + (full ? `<main style="padding-top:0">${main}</main>` : `<main><div class="wrap">${main}</div></main>`) + footer();
  document.getElementById("mScreen").value = SCREENS.some(s => s[0] === S.screen) ? S.screen : "home";
  document.querySelectorAll("#mRole button").forEach(b => b.setAttribute("aria-pressed", b.dataset.role === S.role));
  if (!keepScroll) window.scrollTo(0, 0);
  carInit();
}
function go(scr, keep) {
  S.screen = scr; S.drawer = false;
  if (location.hash.slice(1) !== scr) { try { history.replaceState(null, "", "#" + scr); } catch (e) { } }
  render(keep);
}
// тема макета: по умолчанию «Светлая» даже при тёмной ОС; выбор помним в localStorage
function setSkin(k, save) {
  if (!["light", "warm", "dark"].includes(k)) k = "light";
  document.documentElement.dataset.skin = k;
  document.querySelectorAll("#mSkin button").forEach(b => b.setAttribute("aria-pressed", b.dataset.skin === k));
  if (save) { try { localStorage.setItem("tp24-skin", k); } catch (e) { } }
}
let savedSkin = null; try { savedSkin = localStorage.getItem("tp24-skin"); } catch (e) { }
setSkin(savedSkin || "light");
document.getElementById("mSkin").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setSkin(b.dataset.skin, true); });
document.getElementById("mScreen").innerHTML = SCREENS.map(([k, t]) => `<option value="${k}">${t}</option>`).join("");
document.getElementById("mScreen").addEventListener("change", e => { if (e.target.value === "checkout") S.co.done = false; go(e.target.value); });
document.getElementById("mRole").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.role = b.dataset.role; render(true); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== S.screen) go(h); });

document.addEventListener("click", e => {
  const gb = e.target.closest("[data-gal]");
  if (gb) { S.gal = +gb.dataset.gal; const it = BY[S.prod]; document.getElementById("galMain").src = it.imgs[S.gal]; document.querySelectorAll(".thumbs img").forEach((im, k) => im.classList.toggle("on", k === S.gal)); return; }
  const cb = e.target.closest("[data-car]");
  if (cb) { const v = cb.dataset.car; carGo(v === "next" ? CAR.i + 1 : v === "prev" ? CAR.i - 1 : +v); return; }
  const mn = e.target.closest("[data-mark-node]");
  if (mn) { const [mk, nd] = mn.dataset.markNode.split("|"); S.f = { brands: [], wh: "all", mark: mk, node: nd, sort: "stock" }; go("catalog"); return; }
  const t = e.target.closest("[data-go],[data-prod],[data-act],[data-q],[data-mark],[data-node],[data-step],[data-auth],[data-acct],[data-role-set]");
  if (!t) return;
  if (t.matches("input[type=radio]") && t.dataset.go) { go(t.dataset.go, true); return; }
  if (t.matches("a,button,[role=link],svg,div")) e.preventDefault();
  const d = t.dataset;
  if (d.roleSet) { S.role = d.roleSet; render(true); return; }
  if (d.go) { if (d.reset) S.f = { brands: [], wh: "all", mark: "", node: "", sort: "stock" }; if (d.go === "checkout") S.co.done = false; if (d.go === "bu" || d.go === "catalog") S.f.brands = []; go(d.go); return; }
  if (d.prod && !d.act) { S.prod = d.prod; S.gal = 0; go("product"); return; }
  if (d.q) { S.q = d.q; go("search"); return; }
  if (d.mark) { S.f = { brands: [], wh: "all", mark: d.mark, node: "", sort: "stock" }; go("catalog"); return; }
  if (d.node) { S.f = { brands: [], wh: "all", mark: "", node: d.node, sort: "stock" }; go("catalog"); return; }
  if (d.step !== undefined) { S.co.step = +d.step; render(); return; }
  if (d.auth) { S.authTab = d.auth; go("login"); return; }
  if (d.acct) { S.acctTab = d.acct; render(true); return; }
  const a = d.act;
  if (a === "burger") { S.drawer = !S.drawer; render(true); }
  if (a === "filters") { S.showFilters = !S.showFilters; render(true); }
  if (a === "freset") { S.f = { brands: [], wh: "all", mark: "", node: "", sort: "stock" }; render(true); }
  if (a === "inc" || a === "dec") { const i = document.getElementById(d.for); const mx = +i.dataset.max; let v = (+i.value || 1) + (a === "inc" ? 1 : -1); v = Math.max(1, Math.min(mx, v)); i.value = v; if (a === "inc" && v === mx) toast("Больше нет: свободный остаток " + mx + " шт."); }
  if (a === "add") { const i = document.getElementById(d.for); const it = BY[d.art]; const q = Math.max(1, Math.min(it.free, +i.value || 1)); S.cart[d.art] = Math.min(it.free, (S.cart[d.art] || 0) + q); render(true); toast(`Добавлено: ${d.art} × ${q}`); }
  if (a === "cinc") { const it = BY[d.art]; if (S.cart[d.art] < it.free) S.cart[d.art]++; else toast("Доступно только " + it.free + " шт."); render(true); }
  if (a === "cdec") { if (S.cart[d.art] > 1) S.cart[d.art]--; render(true); }
  if (a === "crm") { delete S.cart[d.art]; render(true); }
  if (a === "place") { S.co.orderNo = "ТУ00-004813"; S.co.done = true; if (S.role === "guest") S.role = "new"; S.cart = {}; render(); }
  if (a === "repeat") { toast("Позиции заказа " + d.order + " добавлены в корзину (в макете — без изменений)"); }
  if (a === "reqprice") { toast("Заявка отправлена менеджеру (в макете — без отправки)"); }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.f === "brand") { S.f.brands = t.checked ? [...S.f.brands, t.value] : S.f.brands.filter(b => b !== t.value); render(true); }
  if (d.f === "wh") { S.f.wh = t.value; render(true); }
  if (d.f === "mark") { S.f.mark = t.value; render(true); }
  if (d.f === "sort") { S.f.sort = t.value; render(true); }
  if (d.pt) S.reqType = d.pt;
  if (d.co) { S.co[d.co] = t.type === "checkbox" ? t.checked : t.value; if (["type", "dlv", "agree"].includes(d.co)) render(true); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.co) { S.co[t.dataset.co] = t.value; if (t.dataset.co === "inn") { const h = document.getElementById("innh"); const ok = innOk(t.value); h.className = "hint " + (ok ? "good" : "bad"); h.textContent = ok ? "Контрольная сумма верна · найдём организацию в 1С" : "Проверьте ИНН: 10 цифр для организации, 12 для ИП"; } }
  if (t.id === "hq") {
    const box = document.getElementById("sugg"); const k = norm(t.value);
    if (k.length < 3) { box.hidden = true; return; }
    const m = ITEMS.filter(i => i.key.includes(k) || norm(i.n).includes(k)).slice(0, 6);
    box.innerHTML = (m.length ? m.map(i => `<a href="#" data-prod="${esc(i.a)}"><span class="sa">${esc(i.a)}</span><span class="sn">${esc(i.n)}</span><b class="num">${rub(priceOf(i))}</b></a>`).join("") : `<span class="all muted">Нет совпадений</span>`) + `<a href="#" class="all" data-q="${esc(t.value)}">Все результаты по «${esc(t.value)}» →</a>`;
    box.hidden = false;
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "hsearch" || f === "bigsearch") { const v = e.target.querySelector("input").value.trim(); if (v) { S.q = v; go("search"); } }
  if (f === "login") { S.role = "ko1"; S.acctTab = "orders"; go("account"); toast("Вы вошли как клиент ко1"); }
  if (f === "register") { S.role = "new"; S.acctTab = "price"; go("account"); toast("Учётка создана · вид цены ждёт подтверждения"); }
  if (f === "reset") toast("Ссылка отправлена (в макете — без отправки)");
  if (f === "lead") toast("Запрос отправлен менеджеру (в макете — без отправки)");
  if (f === "pw") toast("Сохранено (в макете — без отправки)");
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[role=link]")) e.target.click(); });
document.addEventListener("click", e => { if (!e.target.closest(".hsearch")) { const b = document.getElementById("sugg"); if (b) b.hidden = true; } }, true);

(function boot() { const h = location.hash.slice(1); if (VIEWS[h]) S.screen = h; render(); })();
</script>
